<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Blast Undangan Edu Fair 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Library PapaParse untuk baca file CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #f1f5f9; color: #1e293b; padding: 24px; }
        .container { max-width: 1050px; margin: 0 auto; background: white; padding: 32px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid #e2e8f0; padding-bottom: 16px; flex-wrap: wrap; gap: 10px; }
        .header h1 { font-size: 22px; color: #0f172a; }
        .header p { font-size: 13px; color: #64748b; }
        .badge-info { background: #dbeafe; color: #1d4ed8; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; }
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #f8fafc; color: #475569; font-weight: 700; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
        tr:hover { background: #f8fafc; }
        .btn-wa {
            background: #25d366; color: white; padding: 8px 14px; border-radius: 8px;
            text-decoration: none; font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; transition: 0.2s;
        }
        .btn-wa:hover { background: #1ebe5d; transform: translateY(-1px); }
        .btn-preview {
            background: #e2e8f0; color: #334155; padding: 8px 12px; border-radius: 8px;
            text-decoration: none; font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; margin-right: 6px;
        }
        .btn-preview:hover { background: #cbd5e1; }
        .badge-kat {
            background: #e0e7ff; color: #4338ca; padding: 4px 10px; border-radius: 6px; font-size: 11.5px; font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>📱 Admin Panel - Blast Undangan Digital</h1>
                <p>Data ditarik secara otomatis dari file <b>data-tamu.csv</b></p>
            </div>
            <span class="badge-info"><i class="fas fa-database"></i> Auto-Sync CSV Aktif</span>
        </div>
        
        <div class="table-responsive">
            <table id="tabelTamu">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nama Tamu</th>
                        <th>Instansi</th>
                        <th>Kategori</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="5" style="text-align: center; padding: 20px; color: #64748b;">Memuat data tamu...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
